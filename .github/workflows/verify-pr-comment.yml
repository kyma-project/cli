name: verify-pr-comment

on:
  workflow_run:
    workflows: ["verify-pr-code"]
    types: [completed]

permissions: {}

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: standards-check-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Check artifact downloaded
        if: steps.download.outcome == 'failure'
        run: |
          echo "Artifact not found — workflow may have been cancelled. Skipping comment."
        shell: bash

      - name: Read PR number
        if: steps.download.outcome == 'success'
        id: pr
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(cat pr_number.txt 2>/dev/null | tr -d '[:space:]')
          if [ -z "$PR_NUMBER" ]; then
            echo "pr_number.txt is empty or missing"
            exit 1
          fi
          # pr_number.txt comes from the untrusted fork build, so reject
          # anything that is not a plain positive integer.
          if ! printf '%s' "$PR_NUMBER" | grep -Eq '^[1-9][0-9]*$'; then
            echo "pr_number.txt does not contain a valid PR number: '$PR_NUMBER'"
            exit 1
          fi
          # Verify the claimed PR actually belongs to the commit that
          # triggered this run, so a fork cannot steer the comment at an
          # arbitrary PR by writing a different number into the artifact.
          PR_HEAD_SHA=$(gh pr view "$PR_NUMBER" -R kyma-project/cli --json headRefOid --jq '.headRefOid' 2>/dev/null || true)
          if [ "$PR_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo "PR #$PR_NUMBER head ($PR_HEAD_SHA) does not match workflow_run head ($HEAD_SHA); refusing to comment"
            exit 1
          fi
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Post or edit PR comment
        if: steps.download.outcome == 'success' && steps.pr.outcome == 'success'
        run: |
          FLAGS="--body-file comment-body.md"

          LAST_COMMENT_ID=$(gh pr view "${{ steps.pr.outputs.number }}" -R kyma-project/cli --json "comments" \
            | jq --raw-output '.comments[] | select(.author.login=="github-actions[bot]") | .databaseId' \
            | tail -1)

          if [ -n "$LAST_COMMENT_ID" ]; then
            echo "Editing last comment with ID: ${LAST_COMMENT_ID}"
            FLAGS="${FLAGS} --edit-last"
          fi

          gh pr comment "${{ steps.pr.outputs.number }}" -R kyma-project/cli $FLAGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
